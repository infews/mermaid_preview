<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mermaid preview</title>
<style>
  :root {
    --paper: #fbfbf9;
    --ink: #1c1c1a;
    --muted: #6f6f68;
    --rule: #e2e1db;
    --fail: #a8322a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #17181a; --ink: #e6e5e0; --muted: #8e8e88; --rule: #2c2d30; --fail: #e07a70; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  .bar {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--rule);
    flex: 0 0 auto;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.live { background: #4a9d5f; }
  .dot.bad  { background: var(--fail); }
  .name { color: var(--muted); font-size: 13px; }
  .zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .zoom button {
    font: inherit; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 5px;
    padding: 2px 9px; cursor: pointer; min-width: 30px;
  }
  .zoom button:hover { border-color: var(--muted); }
  .zoom button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .level { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .error {
    display: none;
    margin: 0; padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    background: color-mix(in srgb, var(--fail) 10%, var(--paper));
    color: var(--fail);
    font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
    max-height: 40vh; overflow: auto;
  }
  .error.shown { display: block; }
  .canvas { flex: 1 1 auto; overflow: auto; padding: 28px; }
  .canvas.stale { opacity: 0.35; }
  .stage { transform-origin: top left; width: max-content; }
  .stage svg { display: block; height: auto; }
  @media (prefers-reduced-motion: no-preference) {
    .canvas { transition: opacity 120ms ease; }
  }
</style>
<link rel="stylesheet" href="user.css" id="sheet">
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <span class="name" id="name">waiting for first render</span>
    <span class="zoom">
      <button id="out" title="Zoom out">&minus;</button>
      <button id="reset" title="Reset zoom">100%</button>
      <button id="in" title="Zoom in">+</button>
      <span class="level" id="level">100%</span>
    </span>
  </div>
  <pre class="error" id="error"></pre>
  <!-- `mermaid` is the class mermaid.initialize() renders into in a browser, so
       it is what published mermaid stylesheets prefix their selectors with. The
       SVG mmdc hands us has no such ancestor of its own; supplying it here is
       what lets an off-the-shelf sheet style this preview unchanged. -->
  <div class="canvas" id="canvas"><div class="stage mermaid" id="stage"></div></div>

<script>
(() => {
  const stage  = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const errBox = document.getElementById('error');
  const dot    = document.getElementById('dot');
  const name   = document.getElementById('name');
  const level  = document.getElementById('level');
  const sheet  = document.getElementById('sheet');

  let scale = 1;
  const setScale = v => {
    scale = Math.min(4, Math.max(0.25, v));
    stage.style.transform = `scale(${scale})`;
    level.textContent = Math.round(scale * 100) + '%';
  };
  document.getElementById('in').onclick    = () => setScale(scale * 1.25);
  document.getElementById('out').onclick   = () => setScale(scale / 1.25);
  document.getElementById('reset').onclick = () => setScale(1);

  let rev = -1;
  const tick = async () => {
    let state;
    try {
      state = await (await fetch('state.json', { cache: 'no-store' })).json();
    } catch {
      dot.className = 'dot';
      name.textContent = 'preview server stopped';
      return;
    }
    if (state.rev === rev) return;
    rev = state.rev;

    // The browser fetched the sheet once at page load and will never revisit it
    // on its own, so a stale copy would keep applying rules the file no longer
    // has. Re-pointing it per revision is what makes an edit — or a deletion —
    // actually show up. Done for failed renders too: the CSS may be what
    // changed, and it covers a first render that failed before publishing one.
    sheet.href = 'user.css?rev=' + rev;

    if (state.ok) {
      const svg = await (await fetch('preview.svg', { cache: 'no-store' })).text();
      stage.innerHTML = svg;
      canvas.classList.remove('stale');
      errBox.classList.remove('shown');
      dot.className = 'dot live';
      name.textContent = state.source + ' · ' + new Date().toLocaleTimeString();
    } else {
      errBox.textContent = await (await fetch('error.txt', { cache: 'no-store' })).text();
      errBox.classList.add('shown');
      canvas.classList.add('stale');
      dot.className = 'dot bad';
      name.textContent = 'render failed, showing last good diagram';
    }
  };

  tick();
  setInterval(tick, 350);
})();
</script>
</body>
</html>
